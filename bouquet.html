<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tulips for You</title>
<meta property="og:type" content="website">
<meta property="og:title" content="Tulips for You">
<meta property="og:description" content="I coded you a bouquet of tulips ♥">
<meta property="og:url" content="https://YlliAbazi01.github.io/gift/bouquet.html">
<meta property="og:image" content="https://YlliAbazi01.github.io/gift/bouquet-preview.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="1200">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://YlliAbazi01.github.io/gift/bouquet-preview.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Quicksand:wght@500&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0f1e;--ink:#ff9cc0;--soft:#c9b6d6}
html,body{margin:0;height:100%;background:var(--bg);overflow:hidden;-webkit-tap-highlight-color:transparent}
body{background:radial-gradient(ellipse at 50% 40%,#18213d 0%,#0a0f1e 70%);font-family:Quicksand,system-ui,sans-serif;color:var(--soft)}
canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none;cursor:grab}
canvas:active{cursor:grabbing}
.t{position:fixed;left:0;right:0;text-align:center;pointer-events:none;padding:0 16px}
h1{top:calc(env(safe-area-inset-top,0px) + 14px);margin:0;font:400 clamp(34px,9vw,54px)/1.2 'Great Vibes',cursive;color:var(--ink);text-shadow:0 0 18px rgba(255,120,170,.45);opacity:0;animation:fade 1.2s ease .3s forwards}
.bot{bottom:calc(env(safe-area-inset-bottom,0px) + 18px);font-size:11px;letter-spacing:.18em;text-transform:uppercase;opacity:0;animation:fade 1.2s ease 3.2s forwards}
.bot b{display:block;color:var(--ink);font-weight:500;font-size:13px;margin-bottom:6px}
.back{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);left:12px;color:var(--soft);text-decoration:none;font-size:22px;opacity:.6;padding:6px 10px;z-index:2}
.back:hover{opacity:1}
@keyframes fade{to{opacity:1}}
</style>
</head>
<body>
<canvas id="c" aria-label="A rotating bouquet of tulips drawn in coloured text characters" role="img"></canvas>
<a class="back" href="./" aria-label="Back">&larr;</a>
<h1 class="t">Tulips for you</h1>
<div class="t bot"><b>for the love of my life &hearts;</b>swipe to spin</div>
<script>
(function(){
// ---------- geometry: a cloud of coloured points with normals ----------
var PX=[],PY=[],PZ=[],NX=[],NY=[],NZ=[],CR=[],CG=[],CB=[],GR=[],KD=[],KIND=0; // KIND: 0 normal, 1 foliage (light chars), 2 petals (dense chars)
var groups=[]; // {x,y,z,delay}
function group(x,y,z,delay){groups.push({x:x,y:y,z:z,d:delay});return groups.length-1}
function pt(g,x,y,z,nx,ny,nz,c){
  var l=Math.hypot(nx,ny,nz)||1;
  PX.push(x);PY.push(y);PZ.push(z);NX.push(nx/l);NY.push(ny/l);NZ.push(nz/l);
  CR.push(c[0]);CG.push(c[1]);CB.push(c[2]);GR.push(g);KD.push(KIND);
}
function norm(v){var l=Math.hypot(v[0],v[1],v[2])||1;return[v[0]/l,v[1]/l,v[2]/l]}
function cross(a,b){return[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]]}
function shade(c,k){return[Math.min(255,c[0]*k),Math.min(255,c[1]*k),Math.min(255,c[2]*k)]}
var rnd=(function(s){return function(){s=(s*16807)%2147483647;return(s-1)/2147483646}})(20241120);

var STATIC=group(0,0,0,0);
var TAU=Math.PI*2;

// paper cone wrap
var APEX=-1.55,TOP=-0.05,TR=0.8;
for(var it=1;it<=64;it++){
  var t=it/64;
  for(var ip=0;ip<170;ip++){
    var p=ip/170*TAU;
    var r=TR*t*(1+0.05*Math.sin(9*p)*Math.pow(t,8));
    var stripe=Math.floor(p/TAU*18)%2;
    var col=stripe?[255,196,214]:[250,236,232];
    pt(STATIC,r*Math.cos(p),APEX+(TOP-APEX)*t,r*Math.sin(p),Math.cos(p),-0.53,Math.sin(p),col);
  }
}
// ribbon band + bow
function coneR(y){return TR*(y-APEX)/(TOP-APEX)}
for(var iy=0;iy<8;iy++){
  var y=-1.13+iy*0.02, r=coneR(y)+0.02;
  for(var ip=0;ip<150;ip++){var p=ip/150*TAU;pt(STATIC,r*Math.cos(p),y,r*Math.sin(p),Math.cos(p),-0.4,Math.sin(p),[235,40,95])}
}
(function(){
  var p0=-Math.PI/2, y0=-1.065, r0=coneR(y0)+0.05;
  var rad=[Math.cos(p0),0,Math.sin(p0)], tan=[-Math.sin(p0),0,Math.cos(p0)];
  var cx=rad[0]*r0, cz=rad[2]*r0;
  [-1,1].forEach(function(side){
    for(var ia=0;ia<70;ia++){var a=ia/70*TAU;
      for(var iw=-2;iw<=2;iw++){
        var u=side*(0.13+0.12*Math.cos(a)), v=0.075*Math.sin(a)+iw*0.012*Math.cos(a);
        pt(STATIC,cx+tan[0]*u+rad[0]*(0.03+0.04*Math.cos(a)),y0+v,cz+tan[2]*u+rad[2]*(0.03+0.04*Math.cos(a)),rad[0],0.2,rad[2],[255,70,120]);
      }}
    for(var is=0;is<30;is++){var s=is/30;
      for(var iw=-3;iw<=3;iw++){
        var u=side*(0.04+0.1*s)+iw*0.01;
        pt(STATIC,cx+tan[0]*u+rad[0]*0.03,y0-0.3*s,cz+tan[2]*u+rad[2]*0.03,rad[0],0,rad[2],[225,35,85]);
      }}
  });
  for(var i=0;i<80;i++){var a=rnd()*TAU,b=rnd()*Math.PI;pt(STATIC,cx+0.035*Math.sin(b)*Math.cos(a),y0+0.035*Math.cos(b),cz+0.035*Math.sin(b)*Math.sin(a)-0.02,Math.sin(b)*Math.cos(a),Math.cos(b),Math.sin(b)*Math.sin(a),[255,90,140])}
})();
// stems below the wrap
for(var k=0;k<8;k++){
  var az=k/8*TAU+0.3, x0=0.02*Math.cos(az),z0=0.02*Math.sin(az),x1=0.12*Math.cos(az),z1=0.12*Math.sin(az);
  for(var is=0;is<26;is++){var s=is/25,y=-1.45-0.75*s,x=x0+(x1-x0)*s,z=z0+(z1-z0)*s;
    for(var ia=0;ia<10;ia++){var a=ia/10*TAU;pt(STATIC,x+0.025*Math.cos(a),y,z+0.025*Math.sin(a),Math.cos(a),0,Math.sin(a),[70,160,70])}}
}
// greenery filling the dome so no gaps show through
var DOME=[0,0.02,0],DR=1.0;
KIND=1;
for(var i=0;i<2600;i++){
  var yy=1-i/2600*1.3, rr=Math.sqrt(Math.max(0,1-yy*yy)), a=i*2.39996;
  var n=[rr*Math.cos(a),yy,rr*Math.sin(a)];
  pt(STATIC,DOME[0]+n[0]*0.85,DOME[1]+n[1]*0.85,DOME[2]+n[2]*0.85,n[0],n[1],n[2],rnd()<0.5?[24,78,36]:[34,98,44]);
}

KIND=0;
// leaves (grow out first)
var NL=11;
for(var k=0;k<NL;k++){
  var az=k/NL*TAU+0.2, tiltUp=(k%2)?-0.45:0.05;
  var b=[0.72*Math.cos(az),-0.12,0.72*Math.sin(az)];
  var d=norm([Math.cos(az),tiltUp,Math.sin(az)]);
  var sd=norm(cross(d,[0,1,0])), ln=norm(cross(sd,d));
  var L=0.75+rnd()*0.15, g=group(b[0],b[1],b[2],0.2+k*0.06);
  var base=rnd()<0.5?[70,175,75]:[95,195,85];
  for(var is=0;is<=34;is++){var s=is/34,w=0.11*Math.sin(Math.PI*Math.pow(s,0.6));
    for(var iv=-10;iv<=10;iv++){var v=iv/10,
      curl=-0.06*v*v*(w/0.11)+0.15*s*s,
      x=d[0]*s*L+sd[0]*v*w+ln[0]*curl, y=d[1]*s*L+sd[1]*v*w+ln[1]*curl, z=d[2]*s*L+sd[2]*v*w+ln[2]*curl;
      pt(g,x,y,z,ln[0]+sd[0]*v*0.6,ln[1]+sd[1]*v*0.6,ln[2]+sd[2]*v*0.6,iv===0?[45,125,55]:base);
    }}
}

// tulips (bloom one after another)
var PAL=[[235,30,45],[255,105,170],[255,205,40],[250,246,240],[165,95,245],[255,125,35],[255,70,120]];
var LAYOUT=[[0,0]];
for(var q=0;q<7;q++)LAYOUT.push([0.55,q/7*TAU+0.2]);
for(var q=0;q<10;q++)LAYOUT.push([1.08,q/10*TAU+0.5]);
var NF=LAYOUT.length, COLS=[0,1,3,2,4,5,6,3,0,1,2,6,4,3,5,0,1,2,4];
var AX=norm([0,0.8,-0.6]), B1=[1,0,0], B2=cross(AX,B1);
for(var i=0;i<NF;i++){
  var pol=LAYOUT[i][0], a=LAYOUT[i][1], cy=Math.cos(pol), sp=Math.sin(pol);
  var dir=norm([AX[0]*cy+(B1[0]*Math.cos(a)+B2[0]*Math.sin(a))*sp,AX[1]*cy+(B1[1]*Math.cos(a)+B2[1]*Math.sin(a))*sp,AX[2]*cy+(B1[2]*Math.cos(a)+B2[2]*Math.sin(a))*sp]);
  var n=norm([dir[0]*0.6,dir[1]*0.6+1,dir[2]*0.6]); // tulip heads point mostly upwards
  var SL=0.3+rnd()*0.12, c=[DOME[0]+dir[0]*(0.85+SL),DOME[1]+dir[1]*(0.85+SL),DOME[2]+dir[2]*(0.85+SL)];
  var ref=Math.abs(n[1])<0.9?[0,1,0]:[1,0,0], e1=norm(cross(n,ref)), e2=cross(n,e1);
  var col0=PAL[COLS[i%COLS.length]], R=0.125+rnd()*0.02, H=R*2.7, spin=rnd()*TAU;
  var g=group(c[0],c[1],c[2],0.9+i*0.12);
  // short green stem into the greenery
  KIND=0;
  for(var is=0;is<=24;is++){var sl=-(SL+0.05)*(1-is/24);
    for(var ia=0;ia<8;ia++){var aa=ia/8*TAU,rx=e1[0]*Math.cos(aa)+e2[0]*Math.sin(aa),ry=e1[1]*Math.cos(aa)+e2[1]*Math.sin(aa),rz=e1[2]*Math.cos(aa)+e2[2]*Math.sin(aa);
      pt(g,dir[0]*sl+rx*0.02,dir[1]*sl+ry*0.02,dir[2]*sl+rz*0.02,rx,ry,rz,[80,170,75])}}
  // cup of 3 outer + 3 inner pointed petals
  KIND=2;
  for(var L=0;L<2;L++){
    var Rl=R*(L?0.88:1), rot=spin+(L?Math.PI/3:0);
    for(var ih=0;ih<=22;ih++){var t=ih/22;
      for(var ip=0;ip<80;ip++){var th=ip/80*TAU;
        var tmax=0.66+0.34*Math.pow(Math.abs(Math.cos(1.5*(th-rot))),1.6);
        if(t>tmax)continue;
        var r=Rl*(0.32+0.68*Math.sin(Math.PI*t*0.8)), h=H*t;
        var drdh=Rl*0.68*Math.cos(Math.PI*t*0.8)*Math.PI*0.8/H;
        var rx=e1[0]*Math.cos(th)+e2[0]*Math.sin(th), ry=e1[1]*Math.cos(th)+e2[1]*Math.sin(th), rz=e1[2]*Math.cos(th)+e2[2]*Math.sin(th);
        var col=shade(col0,(t>tmax-0.05?0.65:(L?0.8:0.68)+0.4*t));
        pt(g,rx*r+n[0]*h,ry*r+n[1]*h,rz*r+n[2]*h,rx-n[0]*drdh,ry-n[1]*drdh,rz-n[2]*drdh,col);
      }}
  }
  KIND=0;
}
// little white baby's-breath sprigs
for(var i=0;i<0;i++){
  var yy=0.95-rnd()*1.0, rr=Math.sqrt(1-yy*yy), a=rnd()*TAU, rd=DR+0.06+rnd()*0.08;
  var n=[rr*Math.cos(a),yy,rr*Math.sin(a)], g=group(n[0]*rd,DOME[1]+n[1]*rd,n[2]*rd,2.6+rnd()*0.8);
  for(var j=0;j<30;j++){var b1=rnd()*TAU,b2=Math.acos(2*rnd()-1);
    var dx=Math.sin(b2)*Math.cos(b1),dy=Math.cos(b2),dz=Math.sin(b2)*Math.sin(b1);
    pt(g,dx*0.035,dy*0.035,dz*0.035,dx,dy,dz,[255,250,245]);
  }
}

var N=PX.length;
function F(a){return new Float32Array(a)}
PX=F(PX);PY=F(PY);PZ=F(PZ);NX=F(NX);NY=F(NY);NZ=F(NZ);CR=new Uint8Array(CR);CG=new Uint8Array(CG);CB=new Uint8Array(CB);GR=new Uint16Array(GR);KD=new Uint8Array(KD);
var NG=groups.length, GX=new Float32Array(NG),GY=new Float32Array(NG),GZ=new Float32Array(NG),GS=new Float32Array(NG);
groups.forEach(function(g,i){GX[i]=g.x;GY[i]=g.y;GZ[i]=g.z});

// ---------- rendering ----------
var cv=document.getElementById('c'),ctx=cv.getContext('2d');
var W,H,DPR,fs,cw,ch,cols,rows,zb,ib,stars,S,cx0,cy0;
var RAMP='.,:;!*+o%#$&@';
var DIST=5, YC=-0.32, TILT=-0.28;
var LX=-0.35,LY=0.55,LZ=-0.78,ll=Math.hypot(LX,LY,LZ);LX/=ll;LY/=ll;LZ/=ll;
function resize(){
  DPR=Math.min(window.devicePixelRatio||1,2);W=innerWidth;H=innerHeight;
  cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);
  fs=Math.max(6,Math.min(11,Math.min(H/100,W/60)));
  ctx.font='bold '+fs+'px ui-monospace,Menlo,Consolas,"Courier New",monospace';
  ctx.textBaseline='top';
  cw=ctx.measureText('M').width;ch=fs;
  cols=Math.ceil(W/cw);rows=Math.ceil(H/ch);
  zb=new Float32Array(cols*rows);ib=new Int32Array(cols*rows);
  S=Math.min((H-150)*0.92/3.9,W*0.9/3.5);cx0=W/2;cy0=H*0.53;
  stars=[];for(var i=0;i<Math.round(cols*rows/90);i++)stars.push([(Math.random()*cols)|0,(Math.random()*rows)|0,Math.random()*TAU,Math.random()<0.15?'*':Math.random()<0.5?'+':'.']);
}
addEventListener('resize',resize);resize();

var reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
var base=0,ang=0,vel=0,drag=null,t0=performance.now(),last=t0;
cv.addEventListener('pointerdown',function(e){drag={x:e.clientX,a:base,t:e.timeStamp,lx:e.clientX};vel=0;cv.setPointerCapture(e.pointerId)});
cv.addEventListener('pointermove',function(e){if(!drag)return;var dt=Math.max(1,e.timeStamp-drag.t);vel=(e.clientX-drag.lx)/dt*6;drag.lx=e.clientX;drag.t=e.timeStamp;base=drag.a+(e.clientX-drag.x)*0.01});
function up(){drag=null}
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);

function ease(x){if(x<=0)return 0;if(x>=1)return 1;var c=1.7;x-=1;return 1+(c+1)*x*x*x+c*x*x}
function frame(now){
  var dt=Math.min(0.05,(now-last)/1000);last=now;var T=(now-t0)/1000;
  if(!drag){base+=vel*dt;vel*=Math.pow(0.15,dt);
    // after a spin, ease back to facing her
    if(Math.abs(vel)<0.4){var tgt=Math.round(base/TAU)*TAU;base+=(tgt-base)*Math.min(1,dt*1.5)}}
  ang=base+(reduce?0:0.55*Math.sin(T*0.55));
  for(var g=0;g<NG;g++)GS[g]=g===STATIC?1:(reduce?1:ease((T-groups[g].d)/0.9));
  var ca=Math.cos(ang),sa=Math.sin(ang),cb=Math.cos(TILT),sb=Math.sin(TILT),K=S*DIST;
  zb.fill(0);
  for(var i=0;i<N;i++){
    var g=GR[i],s=GS[g];if(s<=0)continue;
    var x=GX[g]+PX[i]*s,y=GY[g]+PY[i]*s-YC,z=GZ[g]+PZ[i]*s;
    var x1=x*ca+z*sa,z1=-x*sa+z*ca;
    var y2=y*cb-z1*sb,z2=y*sb+z1*cb+DIST;
    var iz=1/z2;
    var c=((cx0+K*x1*iz)/cw)|0,r=((cy0-K*y2*iz)/ch)|0;
    if(c<0||c>=cols||r<0||r>=rows)continue;
    var k=r*cols+c;if(iz>zb[k]){zb[k]=iz;ib[k]=i}
  }
  ctx.clearRect(0,0,W,H);
  for(var j=0;j<stars.length;j++){var st=stars[j],k=st[1]*cols+st[0];if(zb[k])continue;
    var a=0.25+0.45*Math.sin(T*1.3+st[2]);if(a<=0.05)continue;
    ctx.fillStyle='rgba(220,210,255,'+a.toFixed(2)+')';ctx.fillText(st[3],st[0]*cw,st[1]*ch)}
  for(var r=0;r<rows;r++)for(var c=0;c<cols;c++){
    var k=r*cols+c;if(!zb[k])continue;var i=ib[k];
    var nx=NX[i],ny=NY[i],nz=NZ[i];
    var nx1=nx*ca+nz*sa,nz1=-nx*sa+nz*ca,ny2=ny*cb-nz1*sb,nz2=ny*sb+nz1*cb;
    if(nz2>0){nx1=-nx1;ny2=-ny2;nz2=-nz2}
    var d=nx1*LX+ny2*LY+nz2*LZ;if(d<0)d=0;
    var lum=0.25+0.75*d;
    var f=0.75+0.4*lum;
    ctx.fillStyle='rgb('+Math.min(255,CR[i]*f|0)+','+Math.min(255,CG[i]*f|0)+','+Math.min(255,CB[i]*f|0)+')';
    var kd=KD[i],ci=kd===1?(lum*4)|0:kd===2?7+((lum*6)|0):(lum*RAMP.length)|0;
    ctx.fillText(RAMP[Math.min(RAMP.length-1,ci)],c*cw,r*ch);
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
